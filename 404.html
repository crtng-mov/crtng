<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Página não encontrada — CRTNG</title>
<meta name="robots" content="noindex">
<script>
  // Endereço com barra no fim que não existe como pasta (ex.: /privacidade/) vai para a mesma página sem a barra.
  // Se a página sem barra também não existir, o GitHub Pages devolve esta página de novo, já sem barra: não há volta.
  (function () {
    var p = location.pathname;
    if (p.length > 1 && p.charAt(p.length - 1) === '/') {
      location.replace(p.replace(/\/+$/, '') + location.search + location.hash);
    }
  })();
</script>
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#0a0a0a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;900&family=Fraunces:ital,opsz,wght@1,9..144,300&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: #0a0a0a;
    color: #f5f5f0;
    font-family: 'Montserrat', sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
    padding: 28px 24px;
  }
  .logo { font-weight: 900; font-size: 22px; letter-spacing: -0.02em; color: #f5f5f0; text-decoration: none; }
  .logo span { color: #03FF5C; }
  main { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: flex-start; max-width: 720px; margin: 0 auto; width: 100%; }
  .codigo { font-size: 12px; font-weight: 500; letter-spacing: 0.4em; text-transform: uppercase; color: #03FF5C; margin-bottom: 18px; }
  h1 { font-weight: 900; font-size: clamp(34px, 7vw, 64px); line-height: 1; letter-spacing: -0.03em; text-transform: uppercase; }
  h1 em { display: block; font-family: 'Fraunces', serif; font-style: italic; font-weight: 300; text-transform: none; letter-spacing: 0; color: #03FF5C; font-size: 1.15em; }
  p { margin: 22px 0 30px; color: #8a8a85; font-size: 16px; line-height: 1.6; }
  .acoes { display: flex; flex-wrap: wrap; gap: 14px 22px; align-items: center; }
  .btn { background: #03FF5C; color: #0a0a0a; text-decoration: none; font-weight: 700; font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; padding: 15px 24px; border-radius: 999px; }
  .link { color: #f5f5f0; text-decoration: none; font-weight: 700; font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; border-bottom: 1px solid rgba(245,245,240,.4); padding-bottom: 3px; }
  .link:hover { border-color: #03FF5C; color: #03FF5C; }
</style>
</head>
<body>
  <a class="logo" href="/">CRTNG<span>.</span></a>
  <main>
    <div class="codigo">Erro 404</div>
    <h1>Esta página <em>não existe.</em></h1>
    <p>O endereço pode ter mudado ou estar digitado errado.</p>
    <div class="acoes">
      <a class="btn" href="/">Voltar ao início</a>
      <a class="link" href="/curso/">Ver o curso</a>
    </div>
  </main>
</body>
</html>
